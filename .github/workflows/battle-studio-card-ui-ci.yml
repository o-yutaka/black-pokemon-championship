name: battle-studio-card-ui-ci

on:
  pull_request:
    paths:
      - "tools/battle_studio/**"
      - ".github/workflows/battle-studio-card-ui-ci.yml"

permissions:
  contents: read

jobs:
  full-card-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Check, test and build frontend
        working-directory: tools/battle_studio/frontend
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test complete public view
        working-directory: tools/battle_studio/backend
        run: |
          python -m py_compile main.py complete_public_view.py public_battle_view.py live_server.py
          python -m unittest -v test_complete_public_view.py

      - name: Protected path guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(submission/|deck\.csv$)'; then
            echo "Protected submission or deck path changed"
            exit 1
          fi
